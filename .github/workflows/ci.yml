name: CI

on:
  pull_request:
    branches: [develop, production]
  workflow_dispatch:

env:
  GO_VERSION: '1.26.5'
  NODE_VERSION: '24.18.0'
  PNPM_VERSION: '11.10.0'

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2

      - name: Install dependencies
        run: pnpm install

      - name: Go vet
        run: |
          for dir in apps/api apps/operator apps/cli apps/workspace-manager pkg/api pkg/operator pkg/workspace pkg/auth; do
            go vet ./$dir/...
          done

      - name: Go lint
        run: |
          for dir in apps/api apps/operator apps/cli apps/workspace-manager pkg/api pkg/operator pkg/workspace pkg/auth; do
            golangci-lint run ./$dir/...
          done

      - name: Go test
        run: |
          for dir in apps/api apps/operator apps/cli apps/workspace-manager pkg/api pkg/operator pkg/workspace pkg/auth; do
            go test -race -count=1 ./$dir/...
          done

      - name: Format check
        run: pnpm prettier --check .

      - name: Oxlint
        run: pnpm oxlint . --ignore-path .gitignore -c .oxlintrc.json

      - name: Build frontend
        run: pnpm --filter dashboard build

  docker:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          tags: ghcr.io/nimbuscore/nimbuscore-api:${{ github.sha }},ghcr.io/nimbuscore/nimbuscore-api:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.operator
          tags: ghcr.io/nimbuscore/nimbuscore-operator:${{ github.sha }},ghcr.io/nimbuscore/nimbuscore-operator:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build workspace-manager image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.workspace-manager
          tags: ghcr.io/nimbuscore/nimbuscore-workspace-manager:${{ github.sha }},ghcr.io/nimbuscore/nimbuscore-workspace-manager:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security Scan
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: node_modules

      - name: Run Trivy in IaC mode (Helm/K8s)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: config
          scan-ref: deploy/
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: |
            trivy-results-*.json
          retention-days: 30

  docker:
    needs: [quality, security]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and scan API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          tags: ghcr.io/nimbuscore/nimbuscore-api:${{ github.sha }},ghcr.io/nimbuscore/nimbuscore-api:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan API image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: image
          scan-ref: ghcr.io/nimbuscore/nimbuscore-api:${{ github.sha }}
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Build operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.operator
          tags: ghcr.io/nimbuscore/nimbuscore-operator:${{ github.sha }},ghcr.io/nimbuscore/nimbuscore-operator:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan operator image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: image
          scan-ref: ghcr.io/nimbuscore/nimbuscore-operator:${{ github.sha }}
          format: sarif
          output: trivy-operator.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Build workspace-manager image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.workspace-manager
          tags: ghcr.io/nimbuscore/nimbuscore-workspace-manager:${{ github.sha }},ghcr.io/nimbuscore/nimbuscore-workspace-manager:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Trivy SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-api.sarif
          category: api

      - name: Upload Trivy SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-operator.sarif
          category: operator

  prebuild:
    needs: quality
    if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'prebuild:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract devcontainer config
        id: devcontainer
        run: |
          if [ -f .devcontainer/devcontainer.json ]; then
            echo "config=.devcontainer/devcontainer.json" >> $GITHUB_OUTPUT
            echo "image=$(cat .devcontainer/devcontainer.json | jq -r '.image // empty')" >> $GITHUB_OUTPUT
          fi

      - name: Build prebuild image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: ghcr.io/nimbuscore/prebuild-${{ github.sha }}:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
