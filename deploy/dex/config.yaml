issuer: http://host.docker.internal:5556/dex
storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556

staticClients:
  - id: nimbuscore
    redirectURIs:
      - http://localhost:8080/auth/callback
      - http://localhost:5173
    name: NimbusCore
    secret: nimbuscore-secret

oauth2:
  skipApprovalScreen: true

# Generar hash con: docker run --rm ghcr.io/dexidp/dex:v2.42.0 dex hash -p admin123
enablePasswordDB: true
staticPasswords:
  - email: admin@nimbuscore.io
    hash: "$2b$10$Sg7cbu3MdZruLplEbr0TEuA29/9pRc3M4uf0aMnSC7xHKWkscJjPu"
    username: admin
    userID: "11111111-1111-1111-1111-111111111111"
