apiVersion: v2
name: nimbuscore
description: Self-hosted DevContainer platform on Kubernetes
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.28.0"

home: https://github.com/nimbuscore/nimbuscore
sources:
  - https://github.com/nimbuscore/nimbuscore

maintainers:
  - name: NimbusCore Team
    email: team@nimbuscore.io

dependencies:
  - name: postgresql
    version: ~16.6.0
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
    alias: postgresql

  - name: redis
    version: ~20.13.0
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
    alias: redis

  - name: rabbitmq
    version: ~16.0.0
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: rabbitmq.enabled
    alias: rabbitmq
