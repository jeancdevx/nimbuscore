apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: prebuilds.nimbuscore.io
  labels:
    app.kubernetes.io/name: nimbuscore
spec:
  group: nimbuscore.io
  names:
    kind: Prebuild
    plural: prebuilds
    singular: prebuild
    shortNames:
      - pb
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - repoUrl
                - outputImage
              properties:
                userId:
                  type: string
                teamId:
                  type: string
                image:
                  type: string
                repoUrl:
                  type: string
                branch:
                  type: string
                devcontainerPath:
                  type: string
                outputImage:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                podName:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      additionalPrinterColumns:
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Output
          type: string
          jsonPath: .spec.outputImage
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
