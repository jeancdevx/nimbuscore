apiVersion: v1
kind: Service
metadata:
  name: {{ include "nimbuscore.operator.fullname" . }}
  labels: {{ include "nimbuscore.operator.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: metrics
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: health
  selector:
    {{- include "nimbuscore.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: operator
