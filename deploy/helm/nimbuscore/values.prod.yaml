ingress:
  hosts:
    - host: api.nimbuscore.io
      paths:
        - path: /
          pathType: Prefix

config:
  logLevel: info
  oidc:
    issuer: https://dex.nimbuscore.io
    redirectUrl: https://api.nimbuscore.io/auth/callback
  ingress:
    host: nimbuscore.io
  snapshot:
    interval: 30m

api:
  replicas: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20

operator:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5

postgresql:
  primary:
    persistence:
      size: 50Gi

redis:
  master:
    persistence:
      size: 20Gi

rabbitmq:
  persistence:
    size: 50Gi
