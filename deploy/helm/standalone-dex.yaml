apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-config
  namespace: default
data:
  config.yaml: |
    issuer: http://dex:5556/dex
    storage:
      type: sqlite3
      config:
        file: /var/dex/dex.db
    web:
      http: 0.0.0.0:5556
    staticClients:
      - id: nimbuscore
        redirectURIs:
          - http://localhost:5173
        name: NimbusCore
        secret: nimbuscore-secret
    oauth2:
      skipApprovalScreen: true
    enablePasswordDB: true
    staticPasswords:
      - email: admin@nimbuscore.io
        hash: "$2b$10$Sg7cbu3MdZruLplEbr0TEuA29/9pRc3M4uf0aMnSC7xHKWkscJjPu"
        username: admin
        userID: "11111111-1111-1111-1111-111111111111"
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: default
spec:
  ports:
    - port: 5556
      targetPort: 5556
  selector:
    app: dex
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
    spec:
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.42.0
          command: ["/usr/local/bin/dex", "serve", "/etc/dex/config.yaml"]
          ports:
            - containerPort: 5556
          volumeMounts:
            - name: config
              mountPath: /etc/dex
      volumes:
        - name: config
          configMap:
            name: dex-config
